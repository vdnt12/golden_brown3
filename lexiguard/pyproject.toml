
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexiguard"
version = "3.2.0"
description = "Private, evidence-backed triage of rental and leave-and-licence agreements (scaffold)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LexiGuard contributors" }]
dependencies = [
  # Ranges here are for the scaffold. Phase 0 replaces them with a pinned lockfile (S3).
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdfium2>=4.30,<6",   # Apache-2.0 OR BSD-3-Clause; never PyMuPDF
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[project.scripts]
lexiguard = "app.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "requires_ollama: test needs a running local Ollama (skipped by default)",
  "privacy_evidence: produces privacy evidence; never run in ordinary CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
